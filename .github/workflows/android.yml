# Android-App (Trusted Web Activity, mobil/android/): Debug-APK bauen, nur bei Tags android-v*.
# Ergebnis als Artefakt des Laufs (kein Release, keine Play-Store-Veröffentlichung). Siehe docs/MOBIL.md.
name: Android
on:
  workflow_dispatch:        # manuell (Build-Probe, ohne Tag/Release)
  push:
    tags: ['android-v*']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: mobil/android }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platforms;android-36 build-tools;36.0.0' }
      - name: Version aus dem Tag prüfen
        if: startsWith(github.ref, 'refs/tags/')   # bei manueller Build-Probe ohne Tag überspringen
        run: |
          tag="${GITHUB_REF_NAME#android-v}"
          ver="$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle)"
          [ "$tag" = "$ver" ] || { echo "Tag $tag passt nicht zu versionName $ver"; exit 1; }
      - name: Gradle-Wrapper prüfen
        uses: gradle/actions/wrapper-validation@v4
      - name: Debug-APK bauen
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: agora-android-debug
          path: mobil/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
