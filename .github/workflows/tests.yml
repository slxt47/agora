# CI: API-Tests (pytest im Docker-Ziel „test“), Frontend-Build + node:test, gitleaks.
name: Tests
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: API-Tests (Docker-Ziel test)
        run: docker build --target test -t agora:test . && docker run --rm agora:test
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Build + Tests
        working-directory: web
        run: npm ci --ignore-scripts && npm run build && npm test
  geheimnisse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 git /repo --no-banner
