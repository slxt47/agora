# LiveKit (SFU) für Agora. Schlüssel kommen aus LIVEKIT_KEYS, die öffentliche IP aus NODE_IP (beides in livekit.env, nicht im Repo).
# Signalisierung (WebSocket) nur auf 127.0.0.1 → Cloudflare-Tunnel leitet https://agora.slxt.dev/rtc dorthin.
# Medien: UDP 7882 (ein Port für alle) und ICE-TCP 7881 als Rückfall – beide in der Firewall offen.
port: 7880
bind_addresses: ["127.0.0.1"]
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  enable_loopback_candidate: false
  interfaces:
    includes: [eth0]        # nur die öffentliche Schnittstelle, nicht die Docker-Brücken
room:
  empty_timeout: 300
  departure_timeout: 20
  max_participants: 100
limit:
  num_tracks: 400
logging:
  level: info
