# Test-LiveKit nur auf 127.0.0.1 (E2E mit Playwright im Host-Netz)
port: 7980
bind_addresses: ["127.0.0.1"]
rtc:
  tcp_port: 7981
  udp_port: 7982
  node_ip: 127.0.0.1
  use_external_ip: false
  enable_loopback_candidate: true
  interfaces:
    includes: [lo]
keys:
  testschluessel: testgeheimnis-testgeheimnis-testgeheimnis-123
room:
  empty_timeout: 60
logging:
  level: warn
