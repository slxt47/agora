# Wegwerf-LiveKit für den Lasttest (scripts/lasttest.sh): gleiche Version wie Produktion, eigene Ports 7710–7712,
# nur 127.0.0.1 (Last-Clients im Host-Netz). Nicht für den Betrieb.
port: 7710
bind_addresses: ["127.0.0.1"]
rtc:
  tcp_port: 7711
  udp_port: 7712
  node_ip: 127.0.0.1
  use_external_ip: false
  enable_loopback_candidate: true
  interfaces:
    includes: [lo]
keys:
  lastschluessel: lastgeheimnis-lastgeheimnis-lastgeheimnis-123
room:
  empty_timeout: 30
  max_participants: 0          # 0 = ohne Grenze (der Test soll die Kapazität zeigen)
limit:
  num_tracks: 0
logging:
  level: warn
