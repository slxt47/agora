<!doctype html>
<html lang="de" data-modus="dunkel">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e2a">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agora">
  <meta name="description" content="Eine freigegebene Agora-Aufzeichnung ansehen.">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/modus.js?v=6"></script>
  <title>Aufzeichnung – Agora</title>
  <script type="module" src="/src/a.js"></script>
</head>
<body>
  <a class="springen" href="#inhalt">Zum Inhalt springen</a>
  <div class="sky" aria-hidden="true"><i></i><i></i><canvas></canvas><div class="meteors"></div></div>
  <header class="bar">
    <a class="marke" href="/" aria-label="Agora – Startseite"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="ag-m" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d4aff"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#ag-m)"/><rect x="9" y="21" width="32" height="23" rx="7" fill="#fff"/><rect x="43.5" y="13.5" width="4.6" height="4.6" rx="1.3" fill="#fff" fill-opacity="0.75"/><rect x="50" y="8" width="3.4" height="3.4" rx="1" fill="#fff" fill-opacity="0.45"/><path d="M38 32.5L54 23.5L54 41.5Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M13 40L25 40L11.5 51Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="18.5" cy="29.5" r="3" fill="url(#ag-m)"/></svg><span>Agora<span class="punkt">.</span></span></a>
    <div class="rechts"><button class="rund" type="button" data-modus-schalter></button></div>
  </header>
  <main class="breit" id="inhalt">
    <section class="card player-karte" aria-labelledby="titel">
      <h2>Freigegebene Aufzeichnung</h2>
      <h1 id="titel">Wird geladen …</h1>
      <p class="sec" id="info"></p>
      <form class="formular oben" id="f-passwort" hidden>
        <label class="feld"><span>Passwort</span><input name="passwort" type="password" autocomplete="off" required><small>Die Person, die dir den Link geschickt hat, kennt das Passwort.</small></label>
        <button class="btn primary" type="submit">Ansehen</button>
      </form>
      <div id="player" class="oben" hidden>
        <video id="video" controls playsinline preload="metadata"></video>
        <div class="knoepfe oben"><a class="btn" id="herunterladen" download>Herunterladen</a></div>
      </div>
      <div class="status oben" id="status" role="status" hidden></div>
    </section>
  </main>
  <footer>
    <p>Agora · Videokonferenzen im Browser · ohne Werbung, ohne Tracking</p>
    <nav class="recht" aria-label="Rechtliches"><a href="https://slxt.org/impressum/">Impressum</a><a href="https://slxt.org/datenschutz/#agora">Datenschutz</a><a href="https://slxt.org/nutzungsbedingungen/#agora">Nutzungsbedingungen</a></nav>
  </footer>
</body>
</html>
